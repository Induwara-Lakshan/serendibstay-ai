
name: serendibstay-payhere-test

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hotel_db_test
      POSTGRES_USER: hotel_user_test
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?Set TEST_DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://hotel_user_test:${TEST_DB_PASSWORD:?Set TEST_DB_PASSWORD}@db:5432/hotel_db_test
      HOTEL_MCP_SERVER_URL: http://mcp:8002/mcp
      TRANSPORT_MCP_SERVER_URL: http://mcp:8003/mcp
    volumes:
      - ./backend/.env:/app/.env:ro
    ports:
      - "8011:8001"
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - ./frontend/.env
    ports:
      - "5184:5174"
    depends_on:
      - backend
    restart: unless-stopped

  mcp:
    build:
      context: ./backend
      dockerfile: Dockerfile.mcp
    environment:
      API_BASE_URL: http://backend:8001
    ports:
      - "8012:8002"
      - "8013:8003"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_test_data:
