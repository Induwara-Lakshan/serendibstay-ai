services:

  db:
    image: postgres:16
    container_name: sri_lanka_hotel_db

    environment:
      POSTGRES_DB: hotel_db
      POSTGRES_USER: hotel_user
      POSTGRES_PASSWORD: hotel_password

    ports:
      - "5433:5432"
      

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: