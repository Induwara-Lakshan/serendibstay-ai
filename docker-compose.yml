services:

  db:
    image: postgres:16
    container_name: sri_lanka_hotel_db

    environment:
      POSTGRES_DB: hotel_db
      POSTGRES_USER: hotel_user
      POSTGRES_PASSWORD: hotel_password

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: serendibstay_backend

    environment:
      DATABASE_URL: postgresql://hotel_user:hotel_password@db:5432/hotel_db
      HOTEL_MCP_SERVER_URL: http://mcp:8002/mcp
      TRANSPORT_MCP_SERVER_URL: http://mcp:8003/mcp

    volumes:
    - ./backend/.env:/app/.env:ro

    ports:
      - "8001:8001"

    depends_on:
      - db

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: serendibstay_frontend

    ports:
      - "5174:5174"

    depends_on:
      - backend

    restart: unless-stopped

  mcp:
    build:
      context: ./backend
      dockerfile: Dockerfile.mcp

    container_name: serendibstay_mcp

    environment:
      API_BASE_URL: http://backend:8001

    ports:
      - "8002:8002"
      - "8003:8003"

    depends_on:
      - backend

    restart: unless-stopped

volumes:
  postgres_data: